spring:
  application:
    name: ecoa
  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}
        chat:
          model: gemini-3.7-flash
          temperature: 0
          response-mime-type: text/plain

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  datasource:
    url: jdbc:h2:file:./ecoa;MODE=PostgreSQL
    username: sa
    password:

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  media:
    directory: midia
    espeak-command: espeak-ng
